<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure LLM Lab</title><link rel="stylesheet" href="/static.css"></head>
<body><main><h1>Secure LLM Lab</h1><p>Educational assistant. Model responses are untrusted text.</p><section><h2>Sign in</h2><label>Username <input id="username" autocomplete="username"></label><label>Password <input id="password" type="password" autocomplete="current-password"></label><button id="login">Sign in</button></section><section><h2>Chat</h2><label>Message <textarea id="message" maxlength="2000"></textarea></label><button id="send" disabled>Send</button><pre id="output" aria-live="polite"></pre></section></main><script src="/app.js" defer></script></body></html>
