[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-llm-application"
version = "0.1.0"
description = "A deliberately understandable AI security training application"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.8.6",
  "httpx==0.28.1",
  "pip-audit==2.9.0",
  "pytest==8.4.1",
  "ruff==0.12.9",
]

[tool.pytest.ini_options]
testpaths = ["tests", "security_tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP"]
# FastAPI intentionally expresses dependencies as default values; "bearer" is a
# protocol label, not a password. Formatting, rather than lint, owns long literals.
ignore = ["B008", "E501", "S101", "S105"]

[tool.bandit]
exclude_dirs = ["tests", "security_tests"]
